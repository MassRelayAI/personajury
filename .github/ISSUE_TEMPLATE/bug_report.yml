# issue-form structure follows A2A's bug-report form (Apache-2.0); fields are our own
name: Bug report
description: Something in PersonaJury does not do what the docs say
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the engine refused a verdict it should have accepted, or accepted one it should have refused, use the
        "Wrong refusal" form instead. Vulnerabilities do not go here: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `personajury --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and CPU, and how you installed (install script, cargo, source).
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or MCP tool
      description: The exact `personajury ...` command, or the MCP tool and its arguments.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The envelope the engine printed (`--pretty`), including `error.code` if there is one.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest input that shows it. A fixture from `fixtures/` is ideal.
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the Code of Conduct (CODE_OF_CONDUCT.md)
          required: true

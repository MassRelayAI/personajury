# adapted from comparegraph crates/comparegraph/Cargo.toml
[package]
name = "jurygraph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A persona jury as an engine: personas, panels, lenses and evidence-checked verdicts, per stratum. No model inside."

[[bin]]
name = "jurygraph"
path = "src/main.rs"

[lib]
name = "jurygraph"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
toml = "0.8"
globset = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

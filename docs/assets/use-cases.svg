<text x="264" y="420" font-size="12" text-anchor="middle" fill="#57606a">reads to the end</text>
<text x="40" y="472" font-size="17" font-weight="700">A deck a CFO reads to the end</text>
<text x="40" y="498" font-size="14" fill="#57606a">A client, a CFO and a skimming board</text>
<text x="40" y="518" font-size="14" fill="#57606a">member judge the slides, one by one.</text>


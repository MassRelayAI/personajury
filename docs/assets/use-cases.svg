<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="1050" role="img" aria-labelledby="t d">
<title id="t">What people use a jury for</title><desc id="d">Six tiles. A marketing site without the AI slop: a page whose gradient hero is struck through, watched by three personas. Docs a newcomer can follow: in a real two-round jury on CompareGraph's docs, critical blockers went from 15 to 6. A logo picked by its audience: in the second round, 7 of 7 personas picked candidate C. A deck a CFO reads to the end: every slide title says what the slide proves. A change checked before merge: only the changes that need a jury get one. Any field: your lens, your personas, with the scores written in words.</desc>
<defs>
<linearGradient id="slop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c297ff"/><stop offset="0.5" stop-color="#ff8ac9"/><stop offset="1" stop-color="#ffc27a"/></linearGradient>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="1" y="1" width="1048" height="558" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1f2328">

<!-- 1 marketing site -->
<rect x="24" y="24" width="324" height="250" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

<text x="718" y="206" font-size="17" font-weight="700">A logo picked by its audience</text>
<text x="718" y="232" font-size="14" fill="#57606a">A forced pick, round 2:</text>
<text x="718" y="252" font-size="14" fill="#57606a">7 of 7 personas picked C.</text>


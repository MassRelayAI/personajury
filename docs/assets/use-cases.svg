<rect x="410" y="80" width="74" height="4" rx="2" fill="#d0d7de"/><rect x="410" y="90" width="66" height="4" rx="2" fill="#d0d7de"/>
<rect x="410" y="104" width="74" height="22" rx="3" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="414" y="119" font-size="9" font-family="monospace" fill="#0550ae">$ git clone</text>
<rect x="410" y="134" width="60" height="4" rx="2" fill="#d0d7de"/><rect x="410" y="144" width="70" height="4" rx="2" fill="#d0d7de"/>
<text x="590" y="94" font-size="13" text-anchor="middle" fill="#57606a">blockers</text>
<text x="590" y="128" font-size="30" text-anchor="middle" fill="#57606a">15 → <tspan font-weight="700" fill="#1f2328">6</tspan></text>
<text x="590" y="150" font-size="12" text-anchor="middle" fill="#57606a">round 1 → round 2</text>
<text x="379" y="206" font-size="17" font-weight="700">Docs a newcomer can follow</text>
<text x="379" y="232" font-size="14" fill="#57606a">A real docs jury: critical blockers</text>
<text x="379" y="252" font-size="14" fill="#57606a">fell from 15 to 6 in two rounds.</text>


<line x1="72" y1="122" x2="220" y2="70" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/>
<rect x="76" y="128" width="100" height="6" rx="3" fill="#1f2328"/>
<rect x="76" y="140" width="40" height="10" rx="3" fill="#0550ae"/>
<g stroke="#ffffff" stroke-width="1.5"><circle cx="262" cy="84" r="11" fill="#0969da"/><circle cx="290" cy="104" r="11" fill="#bf8700"/><circle cx="262" cy="124" r="11" fill="#1a7f37"/></g>
<text x="40" y="206" font-size="17" font-weight="700">A marketing site, without the AI slop</text>
<text x="40" y="232" font-size="14" fill="#57606a">Personas from each audience read every</text>
<text x="40" y="252" font-size="14" fill="#57606a">page before your customers do.</text>

<!-- 2 docs -->
<rect x="363" y="24" width="324" height="250" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="379" y="40" width="292" height="130" rx="8" fill="#dafbe1"/>

<text x="748" y="380" fill="#57606a"><tspan font-weight="700" fill="#1f2328">3</tspan>  I follow, but …</text>
<text x="748" y="400" fill="#57606a"><tspan font-weight="700" fill="#1f2328">5</tspan>  I could retell it …</text>

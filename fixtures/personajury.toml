# Trigger rules for the fixture project (report §10). `personajury should-run` reads them. Rules are data: every project
# writes its own.

# The project's own estimate of what one persona's brief costs the agent in tokens. It is not the engine's measurement;
# the engine never counts tokens, it only reports the byte size of each brief.
tokens_per_brief = 15000

# A public surface: the full panel (spend 0) and every lens.
[[rule]]
class = "public-surface"
paths = ["site/**", "**/pricing*", "**/pricing/**"]
quorum = "high"
panel = "fixture"
lenses = ["critical", "compare", "taste", "recall"]
spend = 0

# Internals: the tests and the adversarial read keep these; no jury.
[[rule]]
class = "internals"
paths = ["crates/**", "tests/**", "migrations/**"]
quorum = "none"

# Copy only: one persona, the cheap lens, the same panel; the seeded draw picks which one sits.
[[rule]]
class = "copy"
paths = ["copy/**"]
quorum = "low"
panel = "fixture"
lenses = ["recall"]
spend = 1

# The human classes: a persona quorum can never decide these. One rule per human class.
[[rule]]
class = "money"
paths = ["**/prices/**"]
quorum = "human"

[[rule]]
class = "permission"
paths = ["**/auth/**"]
quorum = "human"

[[rule]]
class = "deploy"
paths = ["deploy/**"]
quorum = "human"

[[rule]]
class = "secret"
paths = ["**/*.env*"]
quorum = "human"

[[rule]]
class = "licence"
paths = ["LICENSE*"]
quorum = "human"

[[rule]]
class = "public-claim"
paths = ["claims/**"]
quorum = "human"

[[rule]]
class = "brand"
paths = ["brand/**"]
quorum = "human"

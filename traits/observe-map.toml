# A bearing, not a measurement: which observed signal bears on which declared trait, at which pole.
# `trait observed` counts what a persona did in its accepted initial verdicts and reads this table; it never writes a trait.
# A contradicted trait is a question for the author, not a verdict on the persona.
#   signal    severity | blockers | evidence | pick | bottom
#   lens      severity only; "*" = any lens
#   dimension severity only; "*" = any dimension
#   direction severity: below|above; blockers/bottom: more|fewer; evidence: recalled_over_seen|seen_over_recalled;
#             pick: against_majority|with_majority
#   pole      high | low | an option id for a category trait

[[rule]]
id = "price-severity"
signal = "severity"
lens = "compare"
dimension = "price"
direction = "below"
trait = "consumer.price_consciousness"
pole = "high"


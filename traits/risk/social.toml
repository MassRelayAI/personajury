[anchors]
"1" = "avoid being the one who picked the wrong thing; you choose what others have chosen and want names you can point to if it goes badly."
"3" = "pick something less common if you can defend the choice with a good reason."
"5" = "back an unfashionable choice and defend it in public; being the first on your team to use something does not worry you."

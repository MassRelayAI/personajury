[anchors]
"1" = "assume you will be treated like anyone else in this field and read a page as written for you."
"3" = "wonder now and then whether a page was written for people like you and look for a sign that it was."
"5" = "expect to be judged as an outsider in this field and read a page as if it were written for insiders; an in-joke, an assumed background or a stock photo of one kind of person makes you leave."
